<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi Online Sholat Dhuhur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .header-box { background: linear-gradient(135deg, #1e5799 0%,#2989d8 50%,#207cca 100%); color: white; padding: 25px 15px; border-radius: 0 0 15px 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .card-custom { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .btn-kelas { font-weight: 600; min-width: 60px; margin: 3px; border-radius: 8px; }
    .list-group-item { border-radius: 8px !important; margin-bottom: 6px; border: 1px solid #e9ecef; }
    .btn-action { min-width: 110px; font-weight: 600; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="header-box text-center mb-4">
    <h4 class="fw-bold mb-1">PRESENSI ONLINE SHOLAT DHUHUR</h4>
    <p class="mb-0 small">UPT SMP NEGERI 3 SUTOJAYAN</p>
  </div>

  <div class="container" style="max-width: 600px;">
    <!-- PILIH KELAS -->
    <div class="card card-custom p-3 mb-4">
      <label class="form-label fw-bold text-secondary mb-2"><small>PILIH KELAS:</small></label>
      <div class="d-flex flex-wrap justify-content-center" id="containerKelas">
        <button class="btn btn-outline-primary btn-kelas" onclick="loadSiswa('7a')">7a</button>
        <button class="btn btn-outline-primary btn-kelas" onclick="loadSiswa('8a')">8a</button>
        <button class="btn btn-outline-primary btn-kelas" onclick="loadSiswa('8b')">8b</button>
        <button class="btn btn-outline-primary btn-kelas" onclick="loadSiswa('9a')">9a</button>
        <button class="btn btn-outline-primary btn-kelas" onclick="loadSiswa('9b')">9b</button>
      </div>
    </div>

    <!-- DAFTAR SISWA -->
    <div class="card card-custom p-3 mb-5">
      <h6 class="fw-bold text-dark mb-3" id="titleDaftar">Daftar Siswa:</h6>
      
      <div id="loading" class="text-center py-4" style="display: none;">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="small text-muted mt-2">Memuat data siswa...</div>
      </div>

      <ul class="list-group list-group-flush" id="listSiswa">
        <li class="list-group-item text-center text-muted py-4">Silakan pilih kelas terlebih dahulu.</li>
      </ul>
    </div>
  </div>

  <script>
    // URL Deployment Apps Script kamu
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtCvuQfI2GHo-vdY54EJLO1F33jV_LYgHhosRp_SVxsnENE-IjM_yJdg7Qz7zBuUhO/exec";
    var currentKelas = "";

    function loadSiswa(kelas) {
      currentKelas = kelas;
      
      var buttons = document.querySelectorAll('.btn-kelas');
      buttons.forEach(btn => {
        if(btn.innerText.toLowerCase() === kelas.toLowerCase()) {
          btn.classList.remove('btn-outline-primary');
          btn.classList.add('btn-primary');
        } else {
          btn.classList.remove('btn-primary');
          btn.classList.add('btn-outline-primary');
        }
      });

      document.getElementById('titleDaftar').innerText = "Daftar Siswa Kelas " + kelas.toUpperCase() + ":";
      document.getElementById('listSiswa').innerHTML = "";
      document.getElementById('loading').style.display = "block";

      fetch(SCRIPT_URL + '?action=getSiswaData&kelas=' + encodeURIComponent(kelas), {
        method: 'GET',
        redirect: 'follow'
      })
        .then(res => res.json())
        .then(res => {
          document.getElementById('loading').style.display = "none";
          if (res.status === 'success') {
            renderSiswa(res.data);
          } else {
            alert('Gagal mengambil data siswa: ' + (res.message || ''));
          }
        })
        .catch(err => {
          document.getElementById('loading').style.display = "none";
          alert('Gagal terhubung ke server: ' + err.message);
        });
    }

    function renderSiswa(data) {
      var listEl = document.getElementById('listSiswa');
      listEl.innerHTML = "";

      if (!data || data.length === 0) {
        listEl.innerHTML = '<li class="list-group-item text-center text-muted">Tidak ada data siswa.</li>';
        return;
      }

      data.forEach(function(s) {
        var li = document.createElement('li');
        li.className = "list-group-item d-flex justify-content-between align-items-center py-3";

        var namaSpan = document.createElement('span');
        namaSpan.className = "fw-semibold text-dark";
        namaSpan.innerText = s.nama;

        var btnContainer = document.createElement('div');
        btnContainer.className = "d-flex gap-2";

        // 1. Tombol Absen
        if (s.sudahAbsen) {
          var btnSudah = document.createElement('button');
          btnSudah.className = "btn btn-success btn-action";
          btnSudah.disabled = true;
          btnSudah.innerText = "Sudah Absen";
          btnContainer.appendChild(btnSudah);
        } else {
          var btnAbsen = document.createElement('button');
          btnAbsen.className = "btn btn-outline-success btn-action";
          btnAbsen.innerText = "Absen";
          btnAbsen.onclick = function() { doAbsen(s.nama, btnAbsen); };
          btnContainer.appendChild(btnAbsen);
        }

        // 2. Tombol Sanksi (Otomatis menampilkan Teks Rumus dari Spreadsheet)
        if (s.statusSanksi && s.statusSanksi.trim().toLowerCase() !== "aman") {
          var btnSanksi = document.createElement('button');
          btnSanksi.className = "btn btn-danger btn-action";
          btnSanksi.innerText = "Sanksi: " + s.statusSanksi;
          btnSanksi.onclick = function() { kirimWA(s.nama, s.statusSanksi); };
          btnContainer.appendChild(btnSanksi);
        }

        li.appendChild(namaSpan);
        li.appendChild(btnContainer);
        listEl.appendChild(li);
      });
    }

    function doAbsen(nama, btn) {
      btn.disabled = true;
      btn.innerText = "Proses...";

      fetch(SCRIPT_URL + '?action=simpanAbsen&nama=' + encodeURIComponent(nama) + '&kelas=' + encodeURIComponent(currentKelas), {
        method: 'GET',
        redirect: 'follow'
      })
        .then(res => res.json())
        .then(res => {
          btn.className = "btn btn-success btn-action";
          btn.innerText = "Sudah Absen";
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerText = "Absen";
          alert("Gagal menyimpan absen");
        });
    }

    function kirimWA(nama, sanksiText) {
      var pesan = "Assalamu'alaikum Wr. Wb.\n\nInformasi UPT SMP Negeri 3 Sutojayan menginfokan bahwa siswa atas nama *" + nama + "* (Kelas " + currentKelas.toUpperCase() + ") memiliki sanksi presensi sholat dhuhur berupa: *" + sanksiText + "*.\n\nMohon bimbingan dan perhatiannya dari Bapak/Ibu Orang Tua/Wali. Terima kasih.";
      
      var urlWa = "https://wa.me/?text=" + encodeURIComponent(pesan);
      window.open(urlWa, '_blank');
    }
  </script>
</body>
</html>
