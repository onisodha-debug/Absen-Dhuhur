<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi Online Sholat Dhuhur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .main-card {
      max-width: 500px;
      margin: 20px auto;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
      background: #fff;
    }
    .header-bg {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }
    .btn-kelas {
      min-width: 75px;
      font-weight: 600;
      border-radius: 8px;
    }
    .siswa-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid #eef2f7;
    }
    .siswa-row:last-child {
      border-bottom: none;
    }
    .siswa-name {
      font-weight: 500;
      color: #334155;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="main-card">
    <div class="header-bg">
      <h5 class="mb-1 text-uppercase fw-bold">Presensi Online Sholat Dhuhur</h5>
      <small>UPT SMP NEGERI 3 SUTOJAYAN</small>
    </div>

    <div class="p-3">
      <label class="form-label fw-bold text-secondary small">PILIH KELAS:</label>
      <div class="d-flex flex-wrap gap-2 mb-3" id="container-kelas">
        <button class="btn btn-outline-primary btn-kelas" onclick="pilihKelas('7a', this)">7a</button>
        <button class="btn btn-outline-primary btn-kelas" onclick="pilihKelas('8a', this)">8a</button>
        <button class="btn btn-outline-primary btn-kelas" onclick="pilihKelas('8b', this)">8b</button>
        <button class="btn btn-outline-primary btn-kelas" onclick="pilihKelas('9a', this)">9a</button>
        <button class="btn btn-outline-primary btn-kelas" onclick="pilihKelas('9b', this)">9b</button>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="fw-bold text-dark small" id="title-daftar">Daftar Siswa:</span>
      </div>

      <div id="list-siswa" class="border rounded bg-white">
        <div class="text-center p-4 text-muted small">Silakan pilih kelas terlebih dahulu</div>
      </div>
    </div>
  </div>
</div>

<script>
  // Ganti URL ini dengan Web App URL Apps Script milikmu
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtCvuQfI2GHo-vdY54EJLO1F33jV_LYgHhosRp_SVxsnENE-IjM_yJdg7Qz7zBuUhO/exec';
  var selectedKelas = '';

  function pilihKelas(kelas, btn) {
    selectedKelas = kelas;
    
    var buttons = document.querySelectorAll('.btn-kelas');
    buttons.forEach(b => b.classList.replace('btn-primary', 'btn-outline-primary'));
    btn.classList.replace('btn-outline-primary', 'btn-primary');

    document.getElementById('title-daftar').innerText = 'Daftar Siswa Kelas ' + kelas.toUpperCase() + ':';
    loadSiswa(kelas);
  }

  function loadSiswa(kelas) {
    var container = document.getElementById('list-siswa');
    container.innerHTML = '<div class="text-center p-3 text-secondary small">Memuat data siswa...</div>';

    fetch(SCRIPT_URL + '?action=getSiswaData&kelas=' + encodeURIComponent(kelas))
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          renderSiswa(res.data);
        } else {
          container.innerHTML = '<div class="text-center p-3 text-danger small">Gagal memuat data</div>';
        }
      })
      .catch(err => {
        container.innerHTML = '<div class="text-center p-3 text-danger small">Kesalahan jaringan</div>';
      });
  }

  function renderSiswa(data) {
    var container = document.getElementById('list-siswa');
    container.innerHTML = '';

    if (data.length === 0) {
      container.innerHTML = '<div class="text-center p-3 text-muted small">Tidak ada data siswa</div>';
      return;
    }

    data.forEach(function(siswa) {
      var row = document.createElement('div');
      row.className = 'siswa-row';

      var nameElem = '<div class="siswa-name">' + siswa.nama + '</div>';
      
      // 1. Tombol Presensi
      var btnAbsen = '';
      if (siswa.sudahAbsen) {
        btnAbsen = '<button class="btn btn-success btn-sm px-3 me-2" disabled>Sudah Absen</button>';
      } else {
        btnAbsen = '<button class="btn btn-primary btn-sm px-3 me-2" onclick="lakukanAbsen(\'' + siswa.nama + '\', this)">Absen</button>';
      }

      // 2. Tombol Sanksi (HANYA MUNCUL JIKA ADA SANKSI AKTIF / TIDAK AMAN)
      var btnSanksi = '';
      if (siswa.statusSanksi !== 'Aman' && siswa.statusSanksi !== '') {
        btnSanksi = '<button class="btn btn-danger btn-sm fw-bold" onclick="prosesSanksi(\'' + siswa.nama + '\', \'' + siswa.statusSanksi + '\', this)">Sanksi: ' + siswa.statusSanksi + '</button>';
      }

      row.innerHTML = nameElem + '<div class="d-flex align-items-center">' + btnAbsen + btnSanksi + '</div>';
      container.appendChild(row);
    });
  }

  // Bekerja Secara Lokal Cepat Tanpa Full Reload
  function lakukanAbsen(nama, btn) {
    var originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Simpan...';

    fetch(SCRIPT_URL + '?action=simpanAbsen&nama=' + encodeURIComponent(nama) + '&kelas=' + encodeURIComponent(selectedKelas))
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          // Langsung ubah tampilan tombol secara instan
          btn.className = 'btn btn-success btn-sm px-3 me-2';
          btn.innerHTML = 'Sudah Absen';
          btn.disabled = true;
        } else {
          alert('Gagal menyimpan presensi. Silakan coba lagi.');
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      })
      .catch(err => {
        alert('Kesalahan jaringan. Periksa koneksi Anda.');
        btn.disabled = false;
        btn.innerHTML = originalText;
      });
  }

  // Selesaikan Sanksi Cepat Tanpa Full Reload
  function prosesSanksi(nama, statusSanksi, btn) {
    var konfirmasi = confirm('Konfirmasi Penyelesaian Sanksi:\n\nSiswa: ' + nama + '\nStatus: ' + statusSanksi + '\n\nApakah siswa ini SUDAH MELAKSANAKAN sanksi tersebut hari ini?');
    
    if (konfirmasi) {
      var originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Proses...';

      fetch(SCRIPT_URL + '?action=selaikanSanksi&nama=' + encodeURIComponent(nama) + '&kelas=' + encodeURIComponent(selectedKelas))
        .then(res => res.json())
        .then(data => {
          alert('Sanksi untuk ' + nama + ' telah ditandai LUNAS/TUNTAS.');
          // Hapus tombol sanksi secara instan
          btn.remove();
        })
        .catch(err => {
          alert('Gagal memproses sanksi.');
          btn.disabled = false;
          btn.innerHTML = originalText;
        });
    }
  }
</script>

</body>
</html>
